
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f47721" />
  <title>Katalog Outdoor | Orange Store</title>

  <style>
    :root {
      --orange: #f47721;
      --dark: #202020;
      --light: #f6f6f6;
      --green: #25d366;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--dark);
      background: var(--light);
    }

    header {
      background: var(--orange);
      color: white;
      padding: 22px 6%;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    .brand {
      font-size: 26px;
      font-weight: 900;
      letter-spacing: 2px;
    }

    .brand small {
      display: block;
      font-size: 11px;
      letter-spacing: 3px;
      margin-top: 5px;
    }

    .hero {
      padding: 36px 0 20px;
    }

    .hero h1 {
      margin: 0 0 10px;
      font-size: clamp(28px, 5vw, 48px);
      text-transform: uppercase;
    }

    .hero p { margin: 0; line-height: 1.6; }

    main {
      max-width: 1200px;
      margin: auto;
      padding: 28px 18px 50px;
    }

    .toolbar {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 22px;
    }

    input, select {
      min-height: 44px;
      padding: 10px 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      background: white;
      font-size: 14px;
    }

    input { flex: 1; min-width: 180px; }
    select { min-width: 160px; }

    .section-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
    }

    .section-title h2 { margin: 0; }

    #status {
      color: #666;
      font-size: 13px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(225px, 1fr));
      gap: 20px;
    }

    .product {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 3px 15px #0000000c;
      display: flex;
      flex-direction: column;
    }

    .product img {
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      background: #e8e8e8;
    }

    .product-body {
      padding: 16px;
      display: flex;
      flex: 1;
      flex-direction: column;
    }

    .category {
      font-size: 11px;
      color: #777;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .product h3 {
      font-size: 17px;
      margin: 9px 0;
    }

    .price {
      color: var(--orange);
      font-size: 19px;
      font-weight: 800;
    }

    .stock {
      margin: 10px 0 15px;
      font-size: 13px;
    }

    .available { color: #178447; }
    .empty { color: #c0392b; }

    .wa-button {
      display: block;
      margin-top: auto;
      padding: 12px;
      border-radius: 8px;
      background: var(--green);
      color: #102a18;
      text-align: center;
      font-weight: bold;
      text-decoration: none;
    }

    .wa-button.disabled {
      background: #ddd;
      color: #777;
      pointer-events: none;
    }

    .empty-state {
      padding: 35px 10px;
      text-align: center;
      color: #666;
      grid-column: 1 / -1;
    }

    footer {
      padding: 24px 16px;
      text-align: center;
      background: #202020;
      color: #ddd;
      font-size: 13px;
    }

    @media (max-width: 520px) {
      header { padding: 20px; }
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
      .product-body { padding: 12px; }
      .product h3 { font-size: 15px; }
      .price { font-size: 16px; }
      .wa-button { font-size: 12px; }
    }
  </style>
</head>

<body>
  <header>
    <div class="topbar">
      <div class="brand">
        ORANGE STORE
        <small>GEAR FOR ADVENTURE</small>
      </div>
      <div>Katalog Produk Outdoor</div>
    </div>

    <div class="hero">
      <h1>Explore More.</h1>
      <p>Temukan perlengkapan petualangan favoritmu.</p>
    </div>
  </header>

  <main>
    <div class="toolbar">
      <input id="search" type="search"
        placeholder="Cari nama produk..." aria-label="Cari produk" />

      <select id="category" aria-label="Filter kategori">
        <option value="">Semua kategori</option>
      </select>
    </div>

    <div class="section-title">
      <h2>Katalog Produk</h2>
      <span id="status">Memuat produk...</span>
    </div>

    <section id="products" class="grid" aria-live="polite"></section>
  </main>

  <footer>
    © <span id="year"></span> Orange Store · Katalog perlengkapan outdoor
  </footer>

  <script>
    // ===== UBAH KONFIGURASI DI SINI =====

    // Gunakan kode negara 62, tanpa tanda + atau angka 0 di depan.
    const WHATSAPP_NUMBER = "6281234567890";

    // URL CSV publik, misalnya URL CSV yang dipublikasikan dari Google Sheets.
    // Biarkan kosong untuk menggunakan contoh produk di bawah.
    const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQUFQXXyXY5diVra7VN17JBkxPfpGgrcvE1f-raVwQLu6plmzR6nRIvS7mChdPgDZeW1E4rkhSGiocl/pub?gid=0&single=true&output=csv";

    // Ganti dengan data produk milik toko Anda.
    const SAMPLE_PRODUCTS = [
      {
        name: "Tas Adventure 25L",
        category: "Tas",
        price: 450000,
        stock: 8,
        image: "https://placehold.co/600x450/f47721/ffffff?text=Adventure+Bag"
      },
      {
        name: "Jaket Outdoor",
        category: "Pakaian",
        price: 375000,
        stock: 5,
        image: "https://placehold.co/600x450/333333/ffffff?text=Outdoor+Jacket"
      },
      {
        name: "Sepatu Hiking",
        category: "Sepatu",
        price: 625000,
        stock: 0,
        image: "https://placehold.co/600x450/777777/ffffff?text=Hiking+Shoes"
      },
      {
        name: "Botol Minum",
        category: "Aksesori",
        price: 125000,
        stock: 12,
        image: "https://placehold.co/600x450/f47721/ffffff?text=Water+Bottle"
      }
    ];

    // ===== AKHIR KONFIGURASI =====

    const productContainer = document.getElementById("products");
    const statusText = document.getElementById("status");
    const searchInput = document.getElementById("search");
    const categorySelect = document.getElementById("category");

    let products = [...SAMPLE_PRODUCTS];

    const rupiah = value => new Intl.NumberFormat("id-ID", {
      style: "currency",
      currency: "IDR",
      maximumFractionDigits: 0
    }).format(value);

    // Mendukung koma dalam tanda kutip pada CSV.
    function parseCSV(text) {
      const rows = [];
      let row = [];
      let cell = "";
      let quoted = false;

      text = text.replace(/^\uFEFF/, "");

      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        const next = text[i + 1];

        if (char === '"' && quoted && next === '"') {
          cell += '"';
          i++;
        } else if (char === '"') {
          quoted = !quoted;
        } else if (char === "," && !quoted) {
          row.push(cell.trim());
          cell = "";
        } else if ((char === "\n" || char === "\r") && !quoted) {
          if (char === "\r" && next === "\n") i++;
          row.push(cell.trim());
          if (row.some(value => value !== "")) rows.push(row);
          row = [];
          cell = "";
        } else {
          cell += char;
        }
      }

      row.push(cell.trim());
      if (row.some(value => value !== "")) rows.push(row);

      if (rows.length < 2) return [];

      const headers = rows.shift().map(h =>
        h.trim().toLowerCase().replace(/^\uFEFF/, "")
      );

      return rows.map(values => {
        const item = {};
        headers.forEach((header, index) => {
          item[header] = values[index] ?? "";
        });
        return item;
      });
    }

    function numberValue(value) {
      // Format CSV harga/stok sebaiknya angka polos, misalnya 450000.
      const cleaned = String(value ?? "").replace(/[^\d.-]/g, "");
      return Number(cleaned) || 0;
    }

    function normalizeProducts(rows) {
      return rows.map(row => ({
        name: row.name || row.nama || "Produk",
        category: row.category || row.kategori || "Lainnya",
        price: numberValue(row.price ?? row.harga),
        stock: Math.max(0, numberValue(row.stock ?? row.stok)),
        image: row.image || row.gambar || ""
      }));
    }

    async function loadProducts() {
      if (!CSV_URL.trim()) {
        products = [...SAMPLE_PRODUCTS];
        statusText.textContent = `${products.length} produk contoh`;
        renderCategories();
        renderProducts();
        return;
      }

      try {
        const separator = CSV_URL.includes("?") ? "&" : "?";
        const response = await fetch(
          CSV_URL + separator + "_=" + Date.now(),
          { cache: "no-store" }
        );

        if (!response.ok) throw new Error("CSV tidak dapat diakses");

        const csvText = await response.text();
        const parsed = normalizeProducts(parseCSV(csvText));

        if (!parsed.length) throw new Error("Data CSV kosong atau format salah");

        products = parsed;
        statusText.textContent = "Stok diperbarui " +
          new Date().toLocaleTimeString("id-ID");

        renderCategories();
        renderProducts();
      } catch (error) {
        console.error(error);
        statusText.textContent = "CSV gagal dimuat; menampilkan data cadangan";

        if (!products.length) products = [...SAMPLE_PRODUCTS];
        renderCategories();
        renderProducts();
      }
    }

    function renderCategories() {
      const selected = categorySelect.value;
      const categories = [...new Set(
        products.map(p => p.category).filter(Boolean)
      )];

      categorySelect.replaceChildren(new Option("Semua kategori", ""));

      categories.forEach(category => {
        categorySelect.add(new Option(category, category));
      });

      if (categories.includes(selected)) categorySelect.value = selected;
    }

    function makeWhatsAppLink(product) {
      const message =
        `Halo, saya ingin pesan produk ${product.name}. ` +
        `Harga: ${rupiah(product.price)}. Mohon konfirmasi stok terbaru.`;

      return `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(message)}`;
    }

    function renderProducts() {
      const query = searchInput.value.trim().toLowerCase();
      const category = categorySelect.value;

      const filtered = products.filter(product =>
        product.name.toLowerCase().includes(query) &&
        (!category || product.category === category)
      );

      productContainer.replaceChildren();

      if (!filtered.length) {
        productContainer.innerHTML =
          '<div class="empty-state">Produk tidak ditemukan.</div>';
      } else {
        filtered.forEach(product => {
          const card = document.createElement("article");
          card.className = "product";

          const image = document.createElement("img");
          image.src = product.image ||
            "https://placehold.co/600x450/eeeeee/333333?text=Produk";
          image.alt = product.name;
          image.loading = "lazy";
          image.onerror = () => {
            image.onerror = null;
            image.src =
              "https://placehold.co/600x450/eeeeee/333333?text=Produk";
          };

          const body = document.createElement("div");
          body.className = "product-body";

          const categoryLabel = document.createElement("div");
          categoryLabel.className = "category";
          categoryLabel.textContent = product.category;

          const name = document.createElement("h3");
          name.textContent = product.name;

          const price = document.createElement("div");
          price.className = "price";
          price.textContent = rupiah(product.price);

          const stock = document.createElement("div");
          stock.className = "stock " +
            (product.stock > 0 ? "available" : "empty");
          stock.textContent = product.stock > 0
            ? `Stok tersedia: ${product.stock}`
            : "Stok habis";

          const link = document.createElement("a");
          link.className = "wa-button" +
            (product.stock <= 0 ? " disabled" : "");
          link.textContent = product.stock > 0
            ? "Pesan via WhatsApp"
            : "Stok Habis";
          link.href = product.stock > 0 ? makeWhatsAppLink(product) : "#";
          link.target = "_blank";
          link.rel = "noopener noreferrer";
          if (product.stock <= 0) link.setAttribute("aria-disabled", "true");

          body.append(categoryLabel, name, price, stock, link);
          card.append(image, body);
          productContainer.append(card);
        });
      }

      statusText.textContent = `${filtered.length} produk`;
    }

    searchInput.addEventListener("input", renderProducts);
    categorySelect.addEventListener("change", renderProducts);
    document.getElementById("year").textContent = new Date().getFullYear();

    loadProducts();

    // Periksa perubahan stok setiap 60 detik jika CSV dikonfigurasi.
    if (CSV_URL.trim()) {
      setInterval(loadProducts, 60000);
    }
  </script>
</body>
</html>
